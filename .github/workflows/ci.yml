# ==============================================================================
# GitHub Actions CI Workflow - TBD-Supply
# ==============================================================================
# Este workflow ejecuta la integración continua y garantía de calidad (QA).
# Se activa en cada `push` o `pull_request` contra la rama principal `main`.
# ==============================================================================

name: CI & Quality Assurance

# Disparadores de ejecución del flujo de integración continua
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos mínimos de seguridad asignados al token de GitHub
permissions:
  contents: read

# Cancelación automática de ejecuciones redundantes en la misma rama/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Pruebas Integrales y de Seguridad del Backend en Node.js
  # ----------------------------------------------------------------------------
  backend-tests:
    name: Backend Integration & Security Tests
    runs-on: ubuntu-latest
    steps:
      # Paso 1: Obtener el código fuente del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # Paso 2: Configurar la versión oficial de Node.js 24 (LTS)
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Paso 3: Verificar que el motor de Node.js responda correctamente
      - name: Verify Node.js runtime
        run: node -v

      # Paso 4: Ejecutar las suites de prueba (Integración + Batería de Seguridad SQLi/CSRF/RBAC)
      - name: Run test suites (Integration & Security)
        run: npm test

  # ----------------------------------------------------------------------------
  # Job 2: Verificación de Compilación Frontend en Kotlin Compose WebAssembly
  # ----------------------------------------------------------------------------
  wasm-build-check:
    name: Kotlin Wasm Frontend Build Verification
    runs-on: ubuntu-latest
    steps:
      # Paso 1: Obtener el código fuente del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # Paso 2: Configurar Java JDK 21 (Temurin) para compilar Gradle
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      # Paso 3: Configurar caché de Gradle para acelerar builds subsiguientes
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      # Paso 4: Clonar la dependencia del framework UI Miuix
      - name: Clone Miuix UI framework
        run: |
          git clone https://github.com/compose-miuix-ui/miuix.git vendor/miuix
          cd vendor/miuix
          git checkout d8efe187

      # Paso 5: Compilar el bundle WebAssembly de distribución de producción
      - name: Compile Kotlin Compose WebAssembly Distribution
        run: |
          chmod +x gradlew
          ./gradlew :webApp:wasmJsBrowserDistribution -Prelease --no-daemon

      # Paso 6: Validar la integridad de los archivos compilados (.wasm / .js / index.html)
      - name: Verify Wasm Output Bundle Integrity
        run: |
          test -f webApp/build/dist/wasmJs/productionExecutable/index.html
          test -f webApp/build/dist/wasmJs/productionExecutable/composeApp.js
          echo "[OK] Wasm bundle compiled successfully."
