# ==============================================================================
# TBD.SUPPLY — Continuous Integration (CI) Workflow
# ==============================================================================
# Este flujo de trabajo automatizado se ejecuta en cada push o pull request
# enviado a la rama principal (main). Garantiza la validación de sintaxis (LINT),
# verificación de compilación (BUILD) y ejecución de pruebas (TEST).

name: Integración Continua (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos mínimos de lectura por seguridad (Principio de menor privilegio)
permissions:
  contents: read

# Cancela ejecuciones anteriores si se sube un nuevo commit a la misma rama
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Integración Continua (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]

    steps:
      # 1. Obtener el código fuente del repositorio
      - name: 📥 Descargar código fuente
        uses: actions/checkout@v4

      # 2. Configurar el entorno Node.js v24 (Requerido para node:sqlite nativo)
      - name: ⚙️ Configurar Node.js v${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 3. LINT: Verificación de sintaxis y calidad de código (Sin dependencias npm)
      - name: 🧹 [LINT] Verificación estática de sintaxis JavaScript
        run: |
          node --check server/src/index.js
          node --check server/src/app.js
          node --check server/src/config.js

      # 4. BUILD: Verificación de compilación y artefactos estáticos
      - name: 🏗️ [BUILD] Verificación del paquete WebAssembly de la tienda
        run: |
          node -e "if (!require('fs').existsSync('server/dist-web/index.html')) { console.error('Falta index.html en dist-web'); process.exit(1); }"
          node -e "if (!require('fs').existsSync('server/dist-web/composeApp.js')) { console.error('Falta composeApp.js en dist-web'); process.exit(1); }"

      # 5. TEST: Ejecución de la suite completa de pruebas (Integración y Seguridad)
      - name: 🧪 [TEST] Ejecutar pruebas unitarias, de integración y seguridad
        run: npm test
