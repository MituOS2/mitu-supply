# ==============================================================================
# TBD.SUPPLY — Configuration for Netlify Full-Stack Deployment
# ==============================================================================

[build]
  publish = "server/dist-web"
  functions = "netlify/functions"
  command = "npm run build:netlify"

# Redirección Serverless API: Pasa cualquier llamada /api/* a la función de Netlify
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# Redirección SPA: Pasa rutas de interfaz a index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"
