# ==============================================================================
# TBD.SUPPLY — Configuration for Netlify Deployment
# ==============================================================================
# Configuración para el despliegue automático del frontend WebAssembly (Wasm)
# en la red CDN global de Netlify con redirecciones para Single Page App (SPA).

[build]
  publish = "server/dist-web"
  command = "npm run build:netlify"

# Redirección SPA: Cualquier ruta que no coincida con un archivo estático
# se redirige a index.html para que la maneje el enrutador de la aplicación.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Reglas de cabeceras HTTP de rendimiento y seguridad para Netlify
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Access-Control-Allow-Origin = "*"

# Caché óptima para archivos estáticos y binarios WebAssembly
[[headers]]
  for = "*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"
